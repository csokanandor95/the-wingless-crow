name: CI

# A Project_plan.md 31. pontjanak pipeline-ja. A korabbi, minimalis merfoldko
# (typecheck + unit teszt + build) kibovult a Phase 10 QA retegeivel:
# integration teszt, deploy sanity check es Playwright E2E.
#
# Quality gate-ek (31. pont, egy sorral kiegeszitve):
#   Unit tests        PASS
#   Integration       PASS
#   Build             PASS
#   Deploy sanity     PASS   <- uj: a vite.config base:'./' ore
#   E2E               PASS
#   Critical errors   0      <- a Playwright fixture minden teszten figyeli
#
# A main-re erkezo, mind a hat kapun atment push innen megy ki elesbe (Phase 11):
#   job: deploy-pages -> https://csokanandor95.github.io/the-wingless-crow/
# A masik kiadasi csatorna, az itch.io, KEZI feltoltes — ott nincs deploy automatizmus.
#
# Ami SZANDEKOSAN nincs benne, es hogy miert:
#   - visual regression PIXELDIFF-kapukent: meressel megbukott (hamis bukasok + a valodi
#     valtozast elvetette) - helyette kepcsatolas emberi atnezesre, lasd tests/e2e/visual.spec.ts;
#   - performance: a meres egyedul futtatva ervenyes, ezert on-demand;
#   - WebKit: a Playwright buildjeben nincs Web Audio API, igy a jatek be sem tolt
#     (reszletek a playwright.config.ts-ben es a docs/Test-plan.md-ben).

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_performance:
        description: 'Teljesitmenymeres futtatasa (kulon, 1 workerrel)'
        type: boolean
        default: false

permissions:
  contents: read

# Ugyanarra a ref-re erkezo ujabb push megszakitja a mar elavult futast.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, unit, integration, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      # npm ci (nem install): a lockfile-hoz determinisztikusan telepit, es elszall,
      # ha a package.json es a lock kicsuszott egymasbol.
      - name: Install dependencies
        run: npm ci

      # A `vite build` esbuilddel csak LEVAGJA a tipusokat, nem ellenorzi oket — egy zold
      # build tehat nem bizonyitja, hogy a tsc tiszta. Ezert kell kulon lepesnek lennie.
      # A tsconfig include-ja ["src", "tests"], tehat a teszteket is tipusellenorzi.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Integration tests
        run: npm run test:integration

      - name: Production build
        run: npm run build

      # A build UTAN: az egyetlen hibaosztaly, amit sem a typecheck, sem a teszt, sem a
      # build nem fog meg — a root-abszolut asset-utvonalak nemán elrontanak az itch.io
      # es a GitHub Pages deployt, mikozben minden mas zold marad.
      - name: Deploy sanity check
        run: npm run check:build

  e2e:
    name: E2E (Chromium + Firefox smoke)
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A bongeszok ~400 MB-ja verziohoz kotve cache-elheto: a Playwright csomag
      # verzioja a kulcs, tehat egy frissites automatikusan uj cache-t huz.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # A WebKit KIMARAD (lasd a fejlec-kommentet). A `--with-deps` a Linux
      # rendszerkonyvtarakat teszi fel, amik nelkul a headless bongeszo nem indul.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      # Az `npm run e2e` maga futtatja a buildet a Playwright ELOTT (a webServer csak
      # kiszolgal) — igy nem versenyezhet a build a tesztinditassal. Reszletek a
      # playwright.config.ts webServer kommentjeben.
      - name: E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # --- Deploy (Phase 11) ------------------------------------------------------------

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [verify, e2e]
    # CSAK a main-re erkezo push deployol: egy feature branch zold pipeline-ja nem
    # irhatja felul az elo oldalt, es a workflow_dispatch (teljesitmenymeres) sem.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    # A Pages-jogok JOB-szinten allnak, hogy a verify es az e2e job a top-level
    # `contents: read` legkisebb jogosultsagon maradjon.
    permissions:
      contents: read
      pages: write
      id-token: write

    # A Pages deploy SAJAT, NEM megszakithato sorban all. A workflow-szintu
    # `ci-${{ github.ref }}` csoport `cancel-in-progress: true`-ja egy felbeszakitott
    # deployt hagyna maga utan — egy megszakitott TESZT-futas artalmatlan, egy
    # felbeszakitott deploy viszont az ELO oldalt hagyna felkesz allapotban.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A job UJRABUILDEL, nem a verify jobbol atvett artifactot veszi at: a build
      # determinisztikus ugyanarrol a commitrol, es az e2e job MAR MA IS ujrabuildel
      # (`npm run e2e` = build + playwright). Cserebe a verify jobnak nem kell
      # branchenkent egy 23,5 MB-os dist artifactot feltoltenie.
      - name: Production build
        run: npm run build

      # Ugyanaz az or, mint a verify jobban, de EZ az a dist, ami tenylegesen kimegy —
      # es itt a Pages ALUTVONALAT (`/the-wingless-crow/`) vedi. Egy root-abszolut
      # asset-ut (R3) itt némán fatalis lenne: a build zold, az elo oldal fekete.
      - name: Deploy sanity check
        run: npm run check:build

      # EGYSZERI KEZI ELOFELTETEL: a repon a Pages-nek BEKAPCSOLVA KELL lennie —
      #   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
      # (NEM "Deploy from a branch": az a branch-alapu, Jekyll-szeru kiszolgalas,
      #  amivel az alabbi deploy-pages lepes elhasal).
      #
      # Az `actions/configure-pages` `enablement: true` opcioja SZANDEKOSAN NINCS itt:
      # kiprobaltuk, es megbukott (2026-09-12) —
      #   Get Pages site failed:    Not Found
      #   Create Pages site failed: Resource not accessible by integration
      # A Pages site LETREHOZASA (POST /repos/{owner}/{repo}/pages) repo-ADMIN jogot kivan,
      # amivel a GITHUB_TOKEN nem rendelkezik. A `pages: write` a mar LETEZO site-ra valo
      # deployt engedi, nem a letrehozasat — a ketto konnyen osszekeverheto, mert a
      # jogosultsag neve ugyanaz. Tehat ez nem bovebb permission-nel javithato.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dist as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # --- On-demand jobok (workflow_dispatch) ------------------------------------------

  performance:
    name: Teljesitmenymeres
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_performance }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium

      # `--workers=1`: a meres egyedul futtatva ervenyes. Parhuzamos terheles mellett a
      # p95 kepkocka-ido 16,7 ms-rol 51,7-re ugrott — a jatek valtozatlanul.
      - name: Performance
        run: npm run e2e:perf
